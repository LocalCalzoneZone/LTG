# CI (roadmap M0.3): the test suite on the oldest and newest supported Python,
# the client build (tsc) with a dist/ drift check, and a permissive lint.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # The Windows job mirrors the standalone install (the newest python.org
    # release, no UTF-8 mode). It reports, but does not block, until it has
    # been green once; then drop `experimental`.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9", experimental: false }
          - { os: ubuntu-latest, python: "3.14", experimental: false }
          - { os: windows-latest, python: "3.14", experimental: true }
    steps:
      # content/art/ is about 1 GB of PNGs no test reads (the suite's sandbox
      # leaves it out too), so skip it.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/content/art/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: Install (requirements.txt applies constraints.txt)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      # Includes the autoplay smoke slice (the 200-game soak, §D12-3.7).
      - name: Test
        run: python -m pytest tests/ -q

  client:
    name: client build + dist drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /apps/game-ui/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/game-ui/package-lock.json
      - run: npm ci --prefix apps/game-ui
      - name: Build (tsc --noEmit + vite build)
        run: npm --prefix apps/game-ui run build
      # The Windows install serves the committed bundle, so a client change
      # must ship its rebuilt apps/game-ui/dist/ in the same commit.
      - name: Fail if the committed dist/ is stale
        run: |
          if [ -n "$(git status --porcelain -- apps/game-ui/dist)" ]; then
            git status --short -- apps/game-ui/dist
            echo "::error::apps/game-ui/dist/ is out of date: run 'npm --prefix apps/game-ui run build' and commit dist/."
            exit 1
          fi

  lint:
    name: ruff (unused imports, blind except)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/content/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install ruff==0.16.9
      - run: ruff check .
