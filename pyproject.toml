# LTG monorepo root — workspace marker + shared dev/test config.
#
# This is not an installable package. The five real packages live in core/,
# apps/deckbuilder/, apps/combat/, apps/game-server/ and apps/autoplay-tester/,
# each with its own pyproject.toml.
# Install the whole workspace (editable) with:
#
#     pip install -r requirements.txt
#
# Dependency direction (load-bearing): core <- deckbuilder, and
# core <- combat <- game-server <- autoplay-tester. `ltg-core` depends on no app.
# See docs/architecture.md §1.

[tool.pytest.ini_options]
testpaths = ["tests"]

# Lint (CI, roadmap M0.3): deliberately permissive — unused imports, and blind
# `except Exception`. The broad excepts that existed when the rule landed carry
# `# noqa: BLE001`; a new one should say why it must swallow everything.
# Run: ruff check .   (CI pins the ruff version in .github/workflows/ci.yml)
[tool.ruff]
target-version = "py39"
extend-exclude = ["apps/game-ui", "**/node_modules", "**/*.egg-info"]

[tool.ruff.lint]
select = ["F401", "BLE001"]
